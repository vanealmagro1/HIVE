<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lector HIVE · prueba</title>
  <style>
    :root { --purple: #6a3fd6; --soft: #f1ecfc; --ink: #1b1530; --muted: #6b6880; --line: #ebe8f2; --ok: #15803d; --warn: #b45309; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f5fa; color: var(--ink); }
    header { background: linear-gradient(180deg, #2a1a3e, #241634); color: #fff; padding: 18px 16px; }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.04em; }
    header p { margin: 4px 0 0; color: #d9cfe8; font-size: 0.85rem; }
    main { padding: 16px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    button { font: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 14px; width: 100%; background: var(--purple); color: #fff; font-size: 1rem; }
    button:disabled { opacity: 0.5; }
    .diag { font-size: 0.85rem; display: grid; gap: 4px; }
    .diag .ok { color: var(--ok); } .diag .bad { color: #c2410c; }
    .beacon { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; }
    .tag { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.3rem; background: var(--soft); color: var(--purple); }
    .beacon.near .tag { background: var(--purple); color: #fff; }
    .beacon.gone { opacity: 0.45; }
    .name { font-weight: 700; } .sub { color: var(--muted); font-size: 0.8rem; }
    .rssi { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--purple); transition: width .3s; }
    .chip { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f1f0f5; color: #5c5872; }
    .near .chip { background: #e6f6ec; color: var(--ok); }
    small { color: var(--muted); }
    ol { margin: 6px 0 0; padding-left: 20px; font-size: 0.85rem; } code { font-size: 0.8rem; background: #f1f0f5; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>HIVE · Lector de mano (prueba)</h1>
    <p>¿Puede este celular leer los beacons Estimote?</p>
  </header>
  <main>
    <section class="card diag" id="diag"></section>
    <button id="start" type="button">Empezar a escanear</button>
    <section id="list" style="display:grid;gap:10px"></section>
    <section class="card"><small id="stats">Sin lecturas todavía.</small></section>
  </main>
  <script>
    // Beacons identificados con el escáner de la laptop (beacons/beacons.json).
    const KNOWN = [
      { label: '4',  ibeacon: '1:1',         estimote: '794134e389c99640' },
      { label: '06', ibeacon: '42187:11477', estimote: '56af5d4bef8e6e40' },
      { label: '7',  ibeacon: '2:2',         estimote: 'd5cf581ebd4c7adc' },
    ];
    const NEAR_RSSI = -50;        // "pegado" al celular
    const GONE_MS = 10000;
    const ESTIMOTE_SERVICE = '0000fe9a-0000-1000-8000-00805f9b34fb';
    const seen = new Map();       // etiqueta -> { rssi: [], last, kinds:Set }
    let total = 0, unknown = 0;

    const $ = (id) => document.getElementById(id);
    const hex = (dv, from, to) => Array.from({ length: to - from }, (_, i) => dv.getUint8(from + i).toString(16).padStart(2, '0')).join('');

    function diag() {
      const bt = 'bluetooth' in navigator;
      const scan = bt && typeof navigator.bluetooth.requestLEScan === 'function';
      const rows = [
        [window.isSecureContext, 'Contexto seguro (HTTPS o permitido en flags)'],
        [bt, 'Web Bluetooth disponible'],
        [scan, 'Escaneo de beacons (requestLEScan) disponible'],
      ];
      $('diag').innerHTML = '<strong>Diagnóstico</strong>' + rows.map(([ok, t]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✔' : '✘'} ${t}</div>`).join('');
      if (!scan) {
        $('diag').innerHTML += `<div style="margin-top:6px">Para activarlo en Chrome (Android):<ol>
          <li>Abre <code>chrome://flags</code></li>
          <li>Busca <b>Insecure origins treated as secure</b>, escribe <code>${location.origin}</code> y ponlo en <b>Enabled</b></li>
          <li>Busca <b>Experimental Web Platform features</b> y ponlo en <b>Enabled</b></li>
          <li>Toca <b>Relaunch</b> y vuelve a abrir esta página</li></ol></div>`;
        $('start').disabled = true;
      }
    }

    function identify(ev) {
      const found = { kinds: [] };
      const apple = ev.manufacturerData && ev.manufacturerData.get(0x004c);
      if (apple && apple.byteLength >= 23 && apple.getUint8(0) === 0x02 && apple.getUint8(1) === 0x15) {
        found.ibeacon = `${apple.getUint16(18)}:${apple.getUint16(20)}`;
        found.kinds.push('iBeacon');
      }
      const est = ev.serviceData && ev.serviceData.get(ESTIMOTE_SERVICE);
      if (est && est.byteLength >= 9) {
        found.estimote = hex(est, 1, 9);
        found.kinds.push('Estimote');
      }
      const k = KNOWN.find((b) => b.ibeacon === found.ibeacon || (found.estimote && b.estimote.startsWith(found.estimote.slice(0, 16))));
      return k ? { label: k.label, kinds: found.kinds } : null;
    }

    function render() {
      const now = Date.now();
      $('list').innerHTML = KNOWN.map((b) => {
        const s = seen.get(b.label);
        if (!s) return `<div class="card beacon gone"><div class="tag">${b.label}</div><div><div class="name">Beacon ${b.label}</div><div class="sub">aún no detectado</div></div><div></div></div>`;
        const sorted = [...s.rssi].sort((x, y) => x - y);
        const med = sorted[Math.floor(sorted.length / 2)];
        const gone = now - s.last > GONE_MS;
        const near = !gone && med >= NEAR_RSSI;
        const pct = Math.max(0, Math.min(100, (med + 100) * 1.6));
        return `<div class="card beacon ${near ? 'near' : ''} ${gone ? 'gone' : ''}">
          <div class="tag">${b.label}</div>
          <div><div class="name">Beacon ${b.label} <span class="chip">${gone ? 'fuera de alcance' : near ? 'Pegado · leído' : 'En la zona'}</span></div>
            <div class="sub">${[...s.kinds].join(' + ')} · visto hace ${Math.round((now - s.last) / 1000)} s</div>
            <div class="bar"><span style="width:${pct}%"></span></div></div>
          <div class="rssi">${med}<br><small>dBm</small></div></div>`;
      }).join('');
      $('stats').textContent = `${total} anuncios Bluetooth recibidos · ${unknown} de otros dispositivos.`;
    }

    $('start').addEventListener('click', async () => {
      try {
        await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
        $('start').disabled = true;
        $('start').textContent = 'Escaneando… acerca un beacon al celular';
        navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
          total += 1;
          const id = identify(ev);
          if (!id) { unknown += 1; return; }
          const s = seen.get(id.label) || { rssi: [], last: 0, kinds: new Set() };
          s.rssi.push(ev.rssi); if (s.rssi.length > 9) s.rssi.shift();
          s.last = Date.now(); id.kinds.forEach((k) => s.kinds.add(k));
          seen.set(id.label, s);
        });
        setInterval(render, 500);
      } catch (e) {
        $('diag').innerHTML += `<div class="bad">✘ No se pudo iniciar el escaneo: ${e.message}</div>`;
      }
    });

    diag();
    render();
  </script>
</body>
</html>
