<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#241634" />
  <title>HIVE · Lector de mano</title>
  <style>
    :root { --purple: #6a3fd6; --soft: #f1ecfc; --ink: #1b1530; --muted: #6b6880; --line: #ebe8f2; --ok: #15803d; --bad: #c2410c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f5fa; color: var(--ink); }
    header { background: linear-gradient(180deg, #2a1a3e, #241634); color: #fff; padding: 16px; display: flex; align-items: center; gap: 12px; }
    .mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #8a63ee, #6a3fd6); display: grid; place-items: center; font-weight: 800; }
    header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.04em; }
    header p { margin: 2px 0 0; color: #d9cfe8; font-size: 0.8rem; }
    .conn { margin-left: auto; font-size: 0.72rem; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.12); white-space: nowrap; }
    .conn.ok { background: #15803d; } .conn.bad { background: #c2410c; }
    main { padding: 14px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    label.loc { display: grid; gap: 6px; font-weight: 700; font-size: 0.85rem; }
    select { font: inherit; font-size: 1rem; padding: 12px; border-radius: 12px; border: 1px solid #d6d2e2; background: #fff; color: var(--ink); }
    button.main { font: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 15px; width: 100%; background: var(--purple); color: #fff; font-size: 1rem; }
    button.main:disabled { opacity: 0.55; }
    .diag { font-size: 0.82rem; display: grid; gap: 3px; } .diag .ok { color: var(--ok); } .diag .bad { color: var(--bad); }
    .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
    .beacon { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; }
    .tag { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.25rem; background: var(--soft); color: var(--purple); }
    .beacon.near .tag { background: var(--purple); color: #fff; }
    .beacon.gone { opacity: 0.45; }
    .name { font-weight: 700; font-size: 0.92rem; } .sub { color: var(--muted); font-size: 0.78rem; }
    .rssi { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; } .rssi small { color: var(--muted); font-weight: 600; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; } .bar span { display: block; height: 100%; background: var(--purple); transition: width .3s; }
    .send { font: inherit; font-size: 0.78rem; font-weight: 700; border: 1px solid #d6d2e2; background: #fff; border-radius: 9px; padding: 6px 10px; margin-top: 6px; }
    .sent { position: sticky; top: 8px; z-index: 2; border-radius: 14px; padding: 14px; color: #fff; font-weight: 700; display: none; }
    .sent.show { display: block; animation: pop .35s ease-out; } .sent.ok { background: var(--ok); } .sent.warn { background: var(--bad); }
    .sent small { display: block; font-weight: 500; opacity: .9; margin-top: 2px; }
    @keyframes pop { from { transform: scale(.94); opacity: .4; } }
    ol { margin: 6px 0 0; padding-left: 20px; } code { font-size: 0.78rem; background: #f1f0f5; padding: 1px 4px; border-radius: 4px; }
    .log { font-size: 0.8rem; color: var(--muted); display: grid; gap: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="mark">H</div>
    <div><h1>HIVE · Lector de mano</h1><p>Acerca el celular a la caja para leer su etiqueta</p></div>
    <span class="conn" id="conn">…</span>
  </header>
  <main>
    <div class="sent" id="sent"></div>
    <section class="card"><label class="loc">Estoy leyendo en<select id="loc"></select></label></section>
    <section class="card diag" id="diag" hidden></section>
    <button class="main" id="start" type="button">Empezar a leer</button>
    <p class="hint" id="hint">Toca "Empezar a leer" y acepta el permiso de Bluetooth.</p>
    <section id="list" style="display:grid;gap:10px"></section>
    <section class="card log" id="log"><strong style="color:var(--ink)">Enviadas a HIVE</strong><span>Ninguna todavía.</span></section>
  </main>
  <script>
    const NEAR_RSSI = -42;          // "pegado" a la caja
    const MARGIN_DB = 10;           // debe ganar claramente al segundo beacon
    const HOLD_MS = 1000;           // durante al menos 1 s
    const DEBOUNCE_MS = 8000;       // misma caja + misma ubicación: una lectura cada 8 s
    const GONE_MS = 10000;
    const ESTIMOTE_SERVICE = '0000fe9a-0000-1000-8000-00805f9b34fb';
    let CATALOG = [];                // beacons/beacons.json (vía /api/beacons)
    const seen = new Map();          // etiqueta -> { rssi: [], last }
    const lastSent = new Map();      // etiqueta|ubicación -> ms
    let leader = null;               // { label, since }
    const sentLog = [];
    const $ = (id) => document.getElementById(id);
    const hex = (dv, a, b) => Array.from({ length: b - a }, (_, i) => dv.getUint8(a + i).toString(16).padStart(2, '0')).join('');
    const median = (arr) => { const s = [...arr].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

    async function loadCatalog() {
      const r = await fetch('/api/beacons', { cache: 'no-store' });
      const data = await r.json();
      CATALOG = data.beacons || [];
      const homes = new Set(CATALOG.map((b) => b.ubicacion));
      $('loc').innerHTML = (data.ubicaciones || []).map((u) => `<option value="${u.id}">${u.id} · ${u.nombre}${homes.has(u.id) ? '' : ' (otra ubicación)'}</option>`).join('');
      try { const saved = localStorage.getItem('hive-loc'); if (saved) $('loc').value = saved; } catch {}
      render();
    }
    $('loc').addEventListener('change', () => { try { localStorage.setItem('hive-loc', $('loc').value); } catch {} leader = null; });

    async function pingLaptop() {
      try {
        const r = await fetch('/api/estado', { cache: 'no-store' });
        const d = await r.json();
        $('conn').textContent = d.pantallas > 0 ? 'HIVE conectado' : 'HIVE sin abrir';
        $('conn').className = 'conn ' + (d.pantallas > 0 ? 'ok' : 'bad');
      } catch { $('conn').textContent = 'Sin laptop'; $('conn').className = 'conn bad'; }
    }

    function diag() {
      const scan = 'bluetooth' in navigator && typeof navigator.bluetooth.requestLEScan === 'function';
      if (scan && window.isSecureContext) return true;
      $('diag').hidden = false;
      $('diag').innerHTML = `<strong>Falta activar el lector en Chrome</strong><ol>
        <li>Abre <code>chrome://flags</code></li>
        <li><b>Insecure origins treated as secure</b> → escribe <code>${location.origin}</code> → Enabled</li>
        <li><b>Experimental Web Platform features</b> → Enabled</li>
        <li>Relaunch y vuelve a abrir esta página</li></ol>`;
      $('start').disabled = true;
      return false;
    }

    function identify(ev) {
      const apple = ev.manufacturerData && ev.manufacturerData.get(0x004c);
      let ib = null, est = null;
      if (apple && apple.byteLength >= 23 && apple.getUint8(0) === 0x02 && apple.getUint8(1) === 0x15) ib = `${apple.getUint16(18)}:${apple.getUint16(20)}`;
      const sd = ev.serviceData && ev.serviceData.get(ESTIMOTE_SERVICE);
      if (sd && sd.byteLength >= 9) est = hex(sd, 1, 9);
      return CATALOG.find((b) => (ib && b.ids.includes(ib)) || (est && b.ids.some((i) => i.startsWith(est) || est.startsWith(i)))) || null;
    }

    async function send(label, rssi, manual = false) {
      const ubicacion = $('loc').value;
      const key = `${label}|${ubicacion}`;
      const now = Date.now();
      if (!manual && now - (lastSent.get(key) || 0) < DEBOUNCE_MS) return;
      lastSent.set(key, now);
      const b = CATALOG.find((x) => x.etiqueta === label);
      const ok = b && b.ubicacion === ubicacion;
      try {
        const r = await fetch('/api/lecturas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ beacon: label, ubicacion, rssi, lector: 'celular', t: now }) });
        if (!r.ok) throw new Error((await r.json()).error || r.status);
        if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]);
        $('sent').className = 'sent show ' + (ok ? 'ok' : 'warn');
        $('sent').innerHTML = `${ok ? '✓ Enviado' : '⚠ Enviado · fuera de su lugar'} · beacon ${label}<small>${b ? b.producto : ''} → ${ubicacion}</small>`;
        clearTimeout(send.t); send.t = setTimeout(() => { $('sent').className = 'sent'; }, 3500);
        sentLog.unshift(`${new Date(now).toLocaleTimeString()} · beacon ${label} → ${ubicacion}${ok ? '' : ' (fuera de lugar)'}`);
        $('log').innerHTML = '<strong style="color:var(--ink)">Enviadas a HIVE</strong>' + sentLog.slice(0, 6).map((l) => `<span>${l}</span>`).join('');
      } catch (e) {
        $('sent').className = 'sent show warn';
        $('sent').innerHTML = `No se pudo enviar<small>${e.message}. ¿La laptop está en la misma red?</small>`;
      }
    }

    function evaluate() {
      const now = Date.now();
      const ranked = [...seen.entries()].filter(([, s]) => now - s.last < 3000).map(([label, s]) => ({ label, med: median(s.rssi) })).sort((a, b) => b.med - a.med);
      const top = ranked[0];
      const clear = top && top.med >= NEAR_RSSI && (!ranked[1] || top.med - ranked[1].med >= MARGIN_DB);
      if (!clear) { leader = null; return; }
      if (!leader || leader.label !== top.label) { leader = { label: top.label, since: now }; return; }
      if (now - leader.since >= HOLD_MS) send(top.label, top.med);
    }

    function render() {
      const now = Date.now();
      $('list').innerHTML = CATALOG.map((b) => {
        const s = seen.get(b.etiqueta);
        const med = s ? median(s.rssi) : null;
        const gone = !s || now - s.last > GONE_MS;
        const near = !gone && leader && leader.label === b.etiqueta;
        const pct = med === null ? 0 : Math.max(0, Math.min(100, (med + 100) * 1.6));
        return `<div class="card beacon ${near ? 'near' : ''} ${gone ? 'gone' : ''}">
          <div class="tag">${b.etiqueta}</div>
          <div><div class="name">${b.producto}</div>
            <div class="sub">${b.unitId} · su lugar: ${b.ubicacion}${gone ? ' · sin señal' : ''}</div>
            <div class="bar"><span style="width:${pct}%"></span></div>
            ${!gone ? `<button class="send" data-label="${b.etiqueta}" data-rssi="${med}">Enviar lectura</button>` : ''}</div>
          <div class="rssi">${med ?? '—'}<br><small>dBm</small></div></div>`;
      }).join('');
      document.querySelectorAll('button.send').forEach((el) => el.addEventListener('click', () => send(el.dataset.label, Number(el.dataset.rssi), true)));
    }

    $('start').addEventListener('click', async () => {
      try {
        await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
        $('start').disabled = true;
        $('start').textContent = 'Leyendo… acerca el celular a una caja';
        $('hint').textContent = 'Se envía solo cuando una caja queda pegada al celular (o toca "Enviar lectura").';
        navigator.bluetooth.addEventListener('advertisementreceived', (ev) => {
          const b = identify(ev);
          if (!b) return;
          const s = seen.get(b.etiqueta) || { rssi: [], last: 0 };
          s.rssi.push(ev.rssi); if (s.rssi.length > 9) s.rssi.shift();
          s.last = Date.now();
          seen.set(b.etiqueta, s);
        });
        setInterval(() => { evaluate(); render(); }, 400);
      } catch (e) {
        $('diag').hidden = false;
        $('diag').innerHTML = `<div class="bad">✘ No se pudo iniciar: ${e.message}. Revisa Bluetooth, Ubicación y el permiso "Dispositivos cercanos" de Chrome.</div>`;
      }
    });

    diag();
    loadCatalog().catch(() => { $('hint').textContent = 'No se pudo cargar el catálogo de beacons desde la laptop.'; });
    pingLaptop(); setInterval(pingLaptop, 4000);
  </script>
</body>
</html>
